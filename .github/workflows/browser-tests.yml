name: Browser tests on demand
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:types
      - name: Run selected suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$SUITE" = full ]; then
            npm run test:e2e
          else
            npm run test:e2e:smoke
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
